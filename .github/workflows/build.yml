name: Build Puffin

on:
  push:
    branches: [ main, master, develop, dev ]
  pull_request:
    branches: [ main, master, develop, dev ]

jobs:
  # Static analysis of the Fortran source with fortitude, settings in
  # fortitude.toml. This is what `make lint` runs, but it needs only the
  # source, not a configured build, so it runs on its own and reports in
  # seconds. The version is pinned: a new fortitude release can add rules,
  # and that should arrive as a deliberate bump here, not as every open PR
  # going red at once.
  lint:
    name: lint (fortitude)
    runs-on: ubuntu-latest
    env:
      FORTITUDE_VERSION: '0.9.2'
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install fortitude
      run: pip install "fortitude-lint==${FORTITUDE_VERSION}"

    - name: Run fortitude
      # The github format puts each violation inline on the PR; on failure
      # the full format is printed too, since the annotations alone do not
      # show the offending source or the suggested fix.
      run: |
        fortitude check --output-format=github puffin || {
          fortitude check puffin
          exit 1
        }

  build:
    name: build (${{ matrix.os }}, ${{ matrix.mode }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Both modes are built from the same tree but through different backend
      # sources, so a failure in one says nothing about the other. Let each
      # finish and report rather than cancelling its sibling.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # parallel: the usual MPI build.
        # serial:   -DENABLE_PARALLEL=OFF, which compiles
        #           puffin/lib/backends/serial in place of backends/mpi and
        #           runs without a launcher. See doc/SERIAL_BUILD.md.
        mode: [parallel, serial]
        include:
          - os: ubuntu-latest
            compiler: gcc-11
          - mode: parallel
            enable_parallel: 'TRUE'
          - mode: serial
            enable_parallel: 'FALSE'

    steps:
    - uses: actions/checkout@v4

    - name: Fetch the PR base commit
      if: github.event_name == 'pull_request'
      # Only its tree is needed, to list the files the PR changes, which is
      # where compiler warnings get annotated inline.
      run: git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.sha }}
    
    - name: Set up Miniconda
      uses: conda-incubator/setup-miniconda@v3
      with:
        auto-activate-base: false
        activate-environment: puffin
        environment-file: environment.yml
        python-version: '3.11'
        auto-update-conda: true

    - name: Build PFUnit
      shell: bash -l {0}
      run: |
        cd /tmp
        git clone https://github.com/Goddard-Fortran-Ecosystem/pFUnit.git
        cd pFUnit
        mkdir build
        cd build
        cmake .. -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/pfunit-install
        make
        make install
    
    - name: Create build directory
      run: mkdir -p build
    
    - name: Configure with CMake
      id: configure
      shell: bash -l {0}
      working-directory: build
      # The slow test (full CLARA lattice, ~30 s on 2 ranks) is added for
      # anything headed for master: release PRs from dev, and master itself.
      # It is @mpitest, so a serial configure ignores the option. The big test
      # is too large for a hosted runner; it is run on an HPC machine and
      # checked by hpc-evidence.yml instead.
      env:
        SLOW_TESTS: ${{ (github.base_ref == 'master' || github.ref == 'refs/heads/master') && 'TRUE' || 'FALSE' }}
      run: |
        cmake .. \
          -DCMAKE_BUILD_TYPE=Release \
          -DENABLE_PARALLEL:BOOL=${{ matrix.enable_parallel }} \
          -DENABLE_TESTING:BOOL=TRUE \
          -DPUFFIN_SLOW_TESTS:BOOL=$SLOW_TESTS \
          -DENABLE_LINT:BOOL=TRUE \
          -DCMAKE_PREFIX_PATH='${{ github.workspace }}/pfunit-install' \
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install
    
    - name: Build
      shell: bash -l {0}
      working-directory: build
      # ENABLE_LINT adds -Wall -Wextra. The log is kept for the warning report
      # below; --output-sync keeps each file's diagnostics together under -j.
      run: |
        set -o pipefail
        make -j$(nproc) --output-sync=target 2>&1 | tee build.log

    - name: Report compiler warnings
      if: ${{ !cancelled() && steps.configure.outcome == 'success' }}
      shell: bash -l {0}
      working-directory: build
      # Reported, not enforced: the tree still carries legacy warnings (see
      # doc/LINT_NOTES.md). Counts go to the job summary; warnings in files
      # the PR changes are also annotated inline.
      run: |
        changed=
        if [ "${{ github.event_name }}" = pull_request ]; then
          git diff --name-only ${{ github.event.pull_request.base.sha }} HEAD > changed-files.txt
          changed=changed-files.txt
        fi
        python ../.github/scripts/gfortran_warnings.py build.log .. $changed
    
    - name: Check the serial build links no MPI FFTW
      if: matrix.mode == 'serial'
      shell: bash -l {0}
      working-directory: build
      # backends/serial supplies the fftw_mpi_* entry points itself, so a serial
      # build must not link libfftw3_mpi. Nothing else would notice if it crept
      # back in: the build would still succeed and the tests would still pass.
      # libmpi is not checked, because it still arrives transitively whenever
      # the HDF5 in the environment is a parallel one - as it is here.
      run: |
        ldd puffin/puffin
        if ldd puffin/puffin | grep -q libfftw3_mpi; then
          echo "::error::serial build linked libfftw3_mpi"
          exit 1
        fi

    - name: Run tests
      shell: bash -l {0}
      working-directory: build
      # Not `make test`: that runs ctest with no output, so a failure tells you
      # which test failed but not which assertion, and the log that would say
      # is left behind on the runner. --output-on-failure prints it inline.
      run: ctest --output-on-failure
    
    - name: Install
      shell: bash -l {0}
      working-directory: build
      run: cmake --install .
